const SECH = ['الدوري المصري لكرة اليد', 'منتخب مصر - بطولة العالم لكرة اليد 2027'];
const HBF = { 'مصر': '🇪🇬', 'السعودية': '🇸🇦', 'الرأس الأخضر': '🇨🇻', 'إيطاليا': '🇮🇹' };
const hbT = n => `<div class="t">${HBF[n] ? `<div style="width:36px;height:36px;border-radius:50%;background:#33364a;display:flex;align-items:center;justify-content:center;font-size:22px">${HBF[n]}</div>` : HBK[n] ? `<img src="${HBL[HBK[n]]}" alt="" style="border-radius:50%;background:#e9eaf0;object-fit:cover">` : `<div style="width:36px;height:36px;border-radius:50%;background:#33364a;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px">${esc(n.charAt(0))}</div>`}<span>${esc(n)}</span></div>`;
function egHB() {
  const now = Date.now(), L = EGHB.filter(m => new Date(m.t).getTime() >= todayStart()).sort((x, y) => x.sec - y.sec || new Date(x.t) - new Date(y.t));
  if (!L.length) return '';
  const card = m => { const st = new Date(m.t), fin = m.s != null, live = !fin && now >= st && now < +st + 2 * 3600e3, late = !fin && now >= +st + 2 * 3600e3;
    const sc = fin ? `${m.s[1]} : ${m.s[0]}` : '-';
    const tx = fin ? 'انتهت' : live ? 'جارية الآن' : late ? 'بانتظار النتيجة' : st.toLocaleDateString(LOC, { day: 'numeric', month: 'numeric' }) + ' ' + st.toLocaleTimeString(LOC, { hour: 'numeric', minute: '2-digit', timeZone: 'Africa/Cairo' });
    return `<div class="m ${fin ? 'finished' : live ? 'live' : 'upcoming'}" style="cursor:default;margin-top:8px">${BDG(fin ? 'finished' : live ? 'live' : 'upcoming')}${hbT(m.h)}<div><div class="sc">${sc}</div><div class="st" style="text-align:center">${tx}</div></div>${hbT(m.a)}${m.v ? `<div class="goals" style="text-align:center">${esc(m.v)}</div>` : ''}</div>`; };
  let out = '';
